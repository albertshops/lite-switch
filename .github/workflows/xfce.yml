name: Xfce checks

on:
  push:
    paths:
      - "apps/xfce/**"
      - ".github/workflows/xfce.yml"
  pull_request:
    paths:
      - "apps/xfce/**"
      - ".github/workflows/xfce.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/xfce
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev xfwm4 xfconf xfce4-settings xvfb dbus-x11 xterm xdotool xfonts-base
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --release
      - run: python3 tests/desktop_smoke.py
